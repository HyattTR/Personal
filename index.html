  <div class="body"><div class="blk"><span class="tag cn">🗨️ 参考回答</span><p>${esc(p.a)}</p></div></div></div>`).join("");
document.querySelectorAll("#parents .q .head").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"));

/* Checklist */
let ckIdx=0;
$("#checks").innerHTML=CHECKS.map(g=>`
  <div class="ckgroup"><h3>${g.g}</h3>
  ${g.items.map(it=>{const id="ck"+(ckIdx++);return `
    <label class="ck ${checks.has(id)?"done":""}" data-id="${id}">
      <input type="checkbox" ${checks.has(id)?"checked":""}>
      <span><span class="t">${esc(it.t)}</span><div class="d">${esc(it.d)}</div></span>
    </label>`;}).join("")}
  </div>`).join("");
const CK_TOTAL=ckIdx;
document.querySelectorAll(".ck").forEach(l=>{
  l.querySelector("input").onchange=e=>{
    e.target.checked?checks.add(l.dataset.id):checks.delete(l.dataset.id);
    l.classList.toggle("done",e.target.checked);save();updateCk();
  };
});
function updateCk(){$("#cntCheck").textContent=checks.size+"/"+CK_TOTAL;updateCookies();updateMood();renderShop();}
$("#cntCheck").textContent=checks.size+"/"+CK_TOTAL;

/* ===== 花枝鼠吉祥物：点击换加油语 ===== */
const CHEERS=["主人加油！","面试必胜！","你是最棒嘅！","手钟一响，offer 到手！","微笑加眼神，稳晒！","25→8，继续冲！","慢慢讲，唔使急！","花枝鼠为你打气！","今日又进步咗啦！","Serve and Lead，舍你其谁！","勇气唔係唔怕，係惊都做完成！","我哋都要帮最弱嘅队友！"];
function bubbleMsg(t){
  const b=$("#bubble");
  b.textContent=t;
  b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");
}
let lastCheer=0;
$("#mascot").onclick=()=>{
  let i;do{i=Math.floor(Math.random()*CHEERS.length);}while(i===lastCheer);
  lastCheer=i;
  bubbleMsg(CHEERS[i]);
};

/* ===== 装扮系统：每掌握 3 题换新装 ===== */
const OUTFITS=[
 {min:3, name:"🎓 小学霸", svg:'<g><polygon points="105,30 145,45 105,60 65,45" fill="#3A3A3A"/><line x1="145" y1="45" x2="153" y2="72" stroke="#F2C14E" stroke-width="4"/><circle cx="153" cy="74" r="5" fill="#F2C14E"/><circle cx="85" cy="98" r="11" fill="rgba(255,255,255,.25)" stroke="#33302C" stroke-width="3"/><circle cx="125" cy="98" r="11" fill="rgba(255,255,255,.25)" stroke="#33302C" stroke-width="3"/><line x1="96" y1="98" x2="114" y2="98" stroke="#33302C" stroke-width="3"/></g>'},
 {min:6, name:"🧣 光荣少先队员", svg:'<g><polygon points="105,138 84,172 105,158 126,172" fill="#D64545"/><polygon points="105,138 98,158 105,164 112,158" fill="#B53030"/></g>'},
 {min:9, name:"👑 服务小女王", svg:'<g><polygon points="105,20 117,46 142,40 130,60 80,60 68,40 93,46" fill="#F2C14E" stroke="#D9A72E" stroke-width="2"/><circle cx="105" cy="42" r="4" fill="#D64545"/><circle cx="88" cy="48" r="3" fill="#4A7DD6"/><circle cx="122" cy="48" r="3" fill="#4A7DD6"/></g>'},
 {min:12,name:"🦸 冲关小超人", svg:'<g><polygon points="62,128 40,158 48,196 66,176 72,148" fill="#D64545"/><polygon points="148,128 170,158 162,196 144,176 138,148" fill="#D64545"/><polygon points="88,138 105,154 122,138 118,132 105,142 92,132" fill="#D64545"/></g>'},
 {min:15,name:"🎧 音乐小达人", svg:'<g><path d="M58,80 Q105,24 152,80" fill="none" stroke="#555049" stroke-width="10" stroke-linecap="round"/><rect x="46" y="66" width="18" height="30" rx="8" fill="#555049"/><rect x="146" y="66" width="18" height="30" rx="8" fill="#555049"/><text x="168" y="55" font-size="28" fill="#F2C14E">♪</text><text x="26" y="60" font-size="22" fill="#F2C14E">♫</text></g>'},
 {min:18,name:"🎀 优雅小公主", svg:'<g><polygon points="105,52 76,36 82,66" fill="#F08CA6"/><polygon points="105,52 134,36 128,66" fill="#F08CA6"/><circle cx="105" cy="52" r="8" fill="#D65F84"/><circle cx="70" cy="30" r="3" fill="#fff" opacity=".9"/><circle cx="142" cy="26" r="2.5" fill="#fff" opacity=".9"/></g>'},
 {min:21,name:"⭐ 面试之星", svg:'<g><ellipse cx="105" cy="46" rx="46" ry="10" fill="none" stroke="#F2C14E" stroke-width="5" opacity=".95"/><circle cx="62" cy="36" r="4" fill="#F2C14E"/><circle cx="150" cy="36" r="4" fill="#F2C14E"/><circle cx="105" cy="22" r="4.5" fill="#F2C14E"/><circle cx="40" cy="86" r="3" fill="#F2C14E"/><circle cx="170" cy="86" r="3" fill="#F2C14E"/></g>'},
];
function curOutfit(m){let o=null;OUTFITS.forEach(x=>{if(m>=x.min)o=x;});return o;}
let prevOutfit="";
function updateMascot(){
  const m=mastery.size,o=curOutfit(m);
  $("#outfitG").innerHTML=o?o.svg:"";
  $("#outfitLbl").textContent="🎀 装扮："+(o?o.name:"原味小鼠")+"（"+m+"/"+QS.length+" 题）";
  if(o&&prevOutfit&&o.name!==prevOutfit){bubbleMsg("我换上新衣服啦！"+o.name+"！继续冲！🎉");}
  prevOutfit=o?o.name:"";
  updateMood();
}

/* ===== 老鼠饼干：打卡得饼干，喂小鼠 / 换特权 ===== */
const LS_F="ms_fed_v4", LS_R="ms_redeem_v4", LS_REC="ms_redeem_rec_v4";
let fed=parseInt(localStorage.getItem(LS_F)||"0");
let redeemed=parseInt(localStorage.getItem(LS_R)||"0");
let redeemRec=JSON.parse(localStorage.getItem(LS_REC)||"[]");
function cookieAvail(){return Math.max(0,checks.size-fed-redeemed);}
function updateCookies(){
  const a=cookieAvail();
  $("#cookieN").textContent=a;
  $("#feedBtn").disabled=a<=0;
  renderRewardStrip();
}
/* ===== 主页奖励橱窗 ===== */
function renderRewardStrip(){
  const el=$("#rewardRow");if(!el)return;
  const a=cookieAvail();
  el.innerHTML=SHOP.map(s=>{
    const can=a>=s.cost;
    const miss=can?"✓ 可兑换":"还差 "+(s.cost-a)+" 块";
    return `<span class="rchip ${can?"can":""}" data-go="shop" title="${esc(s.desc)}">${s.ic} ${esc(s.name)} <span class="pr">🍪${s.cost} · ${miss}</span></span>`;
  }).join("");
  el.querySelectorAll(".rchip").forEach(c=>c.onclick=()=>{
    const b=document.querySelector('.tab[data-tab="shop"]');
    if(b)b.click();
  });
}
const THANKS=[
 "好吃！谢谢主人！🍪","Yummy! Thank you, master!","好好味！唔该主人！",
 "饼干太好吃啦！我继续为你加油！","Best cookie ever! More studying, please!","正啊！呢块鼠饼一流！",
 "吃饱饱，加油更用力！","One more cookie, one step closer to our dream school!","好味到震！多谢晒主人！",
 "鼠饼满分！主人最好了！","This cookie is delishious! I mean, delicious! 😋","有饼食，自然有力量！继续温书！"
];
let lastThx=-1;
$("#feedBtn").onclick=()=>{
  if(cookieAvail()<=0){bubbleMsg("冇饼干啦，先去打卡清单做任务呀！📝");return;}
  fed++;localStorage.setItem(LS_F,String(fed));updateCookies();
  const f=document.createElement("div");f.className="fly";f.textContent="🍪";
  const r1=$("#feedBtn").getBoundingClientRect(),r2=$("#mascot").getBoundingClientRect();
  f.style.left=r1.left+"px";f.style.top=r1.top+"px";
  document.body.appendChild(f);
  requestAnimationFrame(()=>{
    f.style.left=(r2.left+r2.width/2)+"px";f.style.top=(r2.top+r2.height/2)+"px";
    f.style.opacity=".15";f.style.transform="scale(.3)";
  });
  setTimeout(()=>f.remove(),750);
  const m=$("#mascot");m.classList.add("munch");setTimeout(()=>m.classList.remove("munch"),520);
  let i;do{i=Math.floor(Math.random()*THANKS.length);}while(i===lastThx);
  lastThx=i;
  setTimeout(()=>bubbleMsg(THANKS[i]),350);
};

/* ===== 连击火苗：每天打开自动 +1 ===== */
const LS_S="ms_streak_v4";
let streakData=JSON.parse(localStorage.getItem(LS_S)||'{"last":"","n":0}');
function tickStreak(){
  const today=new Date().toISOString().slice(0,10);
  if(streakData.last===today){$("#streakLbl").textContent="🔥 连击 "+streakData.n+" 天";return;}
  const yest=new Date(Date.now()-864e5).toISOString().slice(0,10);
  const isNew=(streakData.last==="");
  streakData.n=(streakData.last===yest)?streakData.n+1:1;
  streakData.last=today;
  localStorage.setItem(LS_S,JSON.stringify(streakData));
  $("#streakLbl").textContent="🔥 连击 "+streakData.n+" 天";
  if(!isNew&&streakData.n>1)bubbleMsg("连续学习第 "+streakData.n+" 天！🔥 小鼠为你骄傲！");
}

/* ===== 小鼠心情值：随总进度变化表情 ===== */
function moodTier(){
  const p=(mastery.size/QS.length+checks.size/CK_TOTAL)/2;
  if(p<0.1)return"Z";
  if(p<0.4)return"N";
  if(p<0.75)return"H";
  return"S";
}
const MOODS={Z:"😴 打瞌睡",N:"🙂 微笑",H:"😄 好开心",S:"🤩 星星眼"};
function updateMood(){
  const t=moodTier();
  ["N","H","S","Z"].forEach(k=>{const g=$("#face"+k);if(g)g.style.display=(k===t)?"":"none";});
  const l=$("#moodLbl");if(l)l.textContent="💗 心情："+MOODS[t];
}

/* ===== 特权商店 ===== */
const SHOP=[
 {cost:5, ic:"🍦", name:"甜品时间", desc:"周末甜品一份，向家长兑现"},
 {cost:8, ic:"🎮", name:"游戏 30 分钟", desc:"自由游戏时间，timer 由家长定"},
 {cost:10,ic:"🎬", name:"电影之夜", desc:"全家一起看一部她选的电影"},
 {cost:12,ic:"🧹", name:"免家务一次", desc:"今天免做一项日常家务"},
 {cost:16,ic:"🌟", name:"心愿特权", desc:"一个合理的小心愿，家长审核兑现"},
];
function renderShop(){
  const a=cookieAvail();
  const w=$("#shopWallet");
  if(w)w.textContent="🍪 当前饼干余额："+a+" 块（共赚得 "+checks.size+"，已喂 "+fed+"，已兑换 "+redeemed+"）";
  const el=$("#shopList");if(!el)return;
  el.innerHTML=SHOP.map((s,i)=>`
    <div class="shopitem">
      <span class="ic">${s.ic}</span>
      <span class="info"><div class="nm">${s.name} <span style="color:var(--ink3);font-weight:400;font-size:13px">（${s.cost} 块饼干）</span></div>
      <div class="ds">${s.desc}</div></span>
      <button class="buy" data-i="${i}" ${a<s.cost?"disabled":""}>${a<s.cost?"饼干不足":"兑换"}</button>
    </div>`).join("");
  el.querySelectorAll(".buy").forEach(b=>b.onclick=()=>{
    const s=SHOP[+b.dataset.i];
    if(cookieAvail()<s.cost)return;
    if(!confirm("用 "+s.cost+" 块饼干兑换「"+s.name+"」？\n\n兑换后记得提醒家长兑现哦！"))return;
    redeemed+=s.cost;
    localStorage.setItem(LS_R,String(redeemed));
    const today=new Date().toLocaleDateString();
    redeemRec.push({n:s.ic+" "+s.name,d:today});
    localStorage.setItem(LS_REC,JSON.stringify(redeemRec));
    renderShop();updateCookies();confetti(30);
    bubbleMsg("兑换成功！"+s.ic+s.name+"！记得揾家长兑现呀！🎁");
  });
  const r=$("#shopRecord");
  if(r)r.innerHTML=redeemRec.length?
    "<h3 style='font-size:15px;margin-bottom:8px'>📜 已兑换记录</h3>"+
    redeemRec.slice().reverse().map(x=>`<div class="record">${esc(x.n)} <span style="color:var(--ink3)">· ${esc(x.d)}</span></div>`).join("")
    :"";
}

/* ===== 满级彩带庆祝 ===== */
let celebrated=false;
function confetti(n){
  n=n||60;
  const colors=["#C4573B","#F2C14E","#2F7D6D","#F08CA6","#4A7DD6"];
  for(let i=0;i<n;i++){
    const c=document.createElement("div");c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(2.5+Math.random()*2)+"s";
    c.style.animationDelay=(Math.random()*.8)+"s";
    c.style.borderRadius=Math.random()>.5?"50%":"2px";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5500);
  }
}

/* Reset */
function resetAll(){  if(!confirm("确定要清空所有『已掌握』、打卡、饼干、装扮和连击记录吗？"))return;
  mastery.clear();checks.clear();fed=0;redeemed=0;redeemRec=[];prevOutfit="";celebrated=false;
  streakData={last:"",n:0};
  localStorage.setItem(LS_F,"0");localStorage.setItem(LS_R,"0");
  localStorage.setItem(LS_REC,"[]");localStorage.setItem(LS_S,JSON.stringify(streakData));
  save();render();renderShop();$("#streakLbl").textContent="🔥 连击 0 天";
  document.querySelectorAll(".ck").forEach(l=>{l.classList.remove("done");l.querySelector("input").checked=false;});
  updateCk();
}
render();
updateCk();
tickStreak();
renderShop();
</script>
